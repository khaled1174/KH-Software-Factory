<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="612" viewBox="0 0 1200 612" role="img" aria-labelledby="title description"><title id="title">One guarded cycle per ticket</title><desc id="description">Accepted intent is followed by reviewed understanding, reviewed planning, isolated building, documentation proposals, real checks and independent review, then source promotion and recorded acceptance. Tickets run sequentially.</desc><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.title{font-size:30px;font-weight:700;fill:#102a43}.sub{font-size:17px;fill:#52677c}.label{font-size:15px;font-weight:700;letter-spacing:1.4px;fill:#476279}.cardtitle{font-size:24px;font-weight:700;fill:#102a43}.body{font-size:18px;fill:#52677c}.small{font-size:16px;fill:#52677c}.number{font-size:15px;font-weight:700;fill:#2563eb}.white{fill:#fff}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker></defs><rect x="1" y="1" width="1198" height="610" rx="24" fill="#fff" stroke="#dce6ef"/><text x="42" y="52" class="title" >A guarded cycle for every ticket</text><text x="42" y="84" class="sub" >One accepted intent. One staged candidate. One controller-owned acceptance.</text><rect x="42" y="110" width="1116" height="44" rx="12" fill="#eff6ff"/><text x="62" y="138" class="label" >OWNER: ACCEPTED INTENT</text><text x="598" y="138" class="label" >CONTROLLER: SCOPE, LIMITS, STATE AND ACCEPTANCE</text><rect x="42" y="186" width="328" height="154" rx="16" fill="#fbfdff" stroke="#dce6ef"/><rect x="62" y="204" width="38" height="26" rx="8" fill="#eaf2ff"/><text x="71" y="222" class="number" >01</text><text x="62" y="263" class="cardtitle" >Understand</text><text x="62" y="294" class="small" >Project architect proposes guides.</text><text x="62" y="319" class="small" >Separate review approves context.</text><rect x="436" y="186" width="328" height="154" rx="16" fill="#fbfdff" stroke="#dce6ef"/><rect x="456" y="204" width="38" height="26" rx="8" fill="#eaf2ff"/><text x="465" y="222" class="number" >02</text><text x="456" y="263" class="cardtitle" >Plan &amp; review</text><text x="456" y="294" class="small" >Planner defines steps and checks.</text><text x="456" y="319" class="small" >Plan reviewer approves that version.</text><rect x="830" y="186" width="328" height="154" rx="16" fill="#fbfdff" stroke="#dce6ef"/><rect x="850" y="204" width="38" height="26" rx="8" fill="#eaf2ff"/><text x="859" y="222" class="number" >03</text><text x="850" y="263" class="cardtitle" >Build</text><text x="850" y="294" class="small" >Builder edits an isolated candidate.</text><text x="850" y="319" class="small" >Owner scope and permissions apply.</text><rect x="830" y="390" width="328" height="154" rx="16" fill="#fbfdff" stroke="#dce6ef"/><rect x="850" y="408" width="38" height="26" rx="8" fill="#eaf2ff"/><text x="859" y="426" class="number" >04</text><text x="850" y="467" class="cardtitle" >Document</text><text x="850" y="498" class="small" >Documenter proposes approved docs.</text><text x="850" y="523" class="small" >Controller stages validated proposals.</text><rect x="436" y="390" width="328" height="154" rx="16" fill="#fbfdff" stroke="#dce6ef"/><rect x="456" y="408" width="38" height="26" rx="8" fill="#eaf2ff"/><text x="465" y="426" class="number" >05</text><text x="456" y="467" class="cardtitle" >Check &amp; review</text><text x="456" y="498" class="small" >Controller runs configured checks.</text><text x="456" y="523" class="small" >Independent reviewer judges results.</text><rect x="42" y="390" width="328" height="154" rx="16" fill="#fbfdff" stroke="#dce6ef"/><rect x="62" y="408" width="38" height="26" rx="8" fill="#eaf2ff"/><text x="71" y="426" class="number" >06</text><text x="62" y="467" class="cardtitle" >Promote &amp; record</text><text x="62" y="498" class="small" >Import the checked, reviewed source.</text><text x="62" y="523" class="small" >Publish context; record acceptance.</text><path d="M 380 263 H 425" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 774 263 H 819" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 994 350 V 379" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 819 467 H 774" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 425 467 H 380" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="42" y="579" class="sub" >The next ready ticket starts after acceptance. Corrections stay within configured limits.</text></svg>
