<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="584" viewBox="0 0 1200 584" role="img" aria-labelledby="title description"><title id="title">Role models propose; the controller accepts</title><desc id="description">The owner selects Claude Code or Codex, a model and effort for each role before a run. Project architect, planner, builder and documenter propose work. Plan reviewer reviews context and plans, and the independent reviewer assesses checked changes. The deterministic controller manages scope, checks and acceptance.</desc><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.title{font-size:30px;font-weight:700;fill:#102a43}.sub{font-size:17px;fill:#52677c}.label{font-size:15px;font-weight:700;letter-spacing:1.4px;fill:#476279}.cardtitle{font-size:24px;font-weight:700;fill:#102a43}.body{font-size:18px;fill:#52677c}.small{font-size:16px;fill:#52677c}.number{font-size:15px;font-weight:700;fill:#2563eb}.white{fill:#fff}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker></defs><rect x="1" y="1" width="1198" height="582" rx="24" fill="#fff" stroke="#dce6ef"/><text x="42" y="52" class="title" >Role models propose. The controller accepts.</text><text x="42" y="84" class="sub" >Separate phase contexts preserve the responsibilities of planning, implementation and review.</text><rect x="42" y="110" width="1116" height="56" rx="12" fill="#eff6ff"/><text x="62" y="144" class="label" >OWNER CHOICE</text><text x="218" y="144" class="body" >Claude Code or Codex + model + effort, recorded per role before the run.</text><rect x="42" y="200" width="342" height="304" rx="16" fill="#fbfdff" stroke="#dce6ef"/><rect x="429" y="200" width="342" height="304" rx="16" fill="#fbfdff" stroke="#dce6ef"/><rect x="816" y="200" width="342" height="304" rx="16" fill="#fbfdff" stroke="#dce6ef"/><text x="64" y="236" class="label" >PROPOSALS</text><text x="64" y="276" class="body" font-weight="700" fill="#102a43">Project architect</text><text x="64" y="301" class="small" >Current project guides</text><text x="64" y="334" class="body" font-weight="700" fill="#102a43">Planner</text><text x="64" y="359" class="small" >Steps, paths and check obligations</text><text x="64" y="392" class="body" font-weight="700" fill="#102a43">Builder</text><text x="64" y="417" class="small" >Changes in the isolated candidate</text><text x="64" y="450" class="body" font-weight="700" fill="#102a43">Documenter</text><text x="64" y="475" class="small" >Proposals for approved doc paths</text><text x="451" y="236" class="label" >CONTROLLER</text><text x="451" y="278" class="body" font-weight="700">Deterministic coordination</text><text x="451" y="318" class="small" >Scope and protected-file checks</text><text x="451" y="351" class="small" >Configured command execution</text><text x="451" y="384" class="small" >Evidence and source fingerprints</text><text x="451" y="417" class="small" >Process ownership and limits</text><text x="451" y="450" class="small" >Promotion, receipts and ledger</text><text x="838" y="236" class="label" >INDEPENDENT REVIEW</text><text x="838" y="284" class="body" font-weight="700">Plan reviewer</text><text x="838" y="314" class="small" >Project context and exact plan version</text><text x="838" y="385" class="body" font-weight="700">Reviewer</text><text x="838" y="415" class="small" >Checked changes, requirements</text><text x="838" y="442" class="small" >and recorded evidence</text><path d="M 390 350 H 420" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 780 318 H 807" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 807 420 H 780" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="42" y="548" class="sub" >Only the controller completes tasks. Reviews and proposals do not grant additional permissions.</text></svg>
